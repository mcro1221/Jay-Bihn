<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jay Bihn — Welding, Glass & Fabrication</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17160f;
    --fg: #eee7d6;
    --fg-dim: #a89f8b;
    --fg-faint: #6e6656;
    --ember: #dd6a2c;
    --line: rgba(238, 231, 214, 0.13);
    --font-head: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Work Sans', -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; }
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { animation-duration: 0.01ms !important; }
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-weight: 300;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }

  .wrap { max-width: 960px; margin: 0 auto; padding: 0 28px; }

  header { padding: 32px 0 0; }
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }
  .name {
    font-family: var(--font-head);
    font-size: 1.1rem;
    letter-spacing: 0.02em;
    font-weight: 500;
  }
  .nav-links { display: flex; gap: 28px; font-size: 0.9rem; color: var(--fg-dim); }
  .nav-links a:hover { color: var(--fg); }
  @media (max-width: 520px) { .nav-links { gap: 18px; font-size: 0.82rem; } }

  .hero { padding: 70px 0 56px; }
  h1 {
    font-family: var(--font-head);
    font-weight: 600;
    font-size: clamp(2rem, 5.5vw, 3rem);
    line-height: 1.15;
    letter-spacing: -0.01em;
  }
  .hero .disciplines { margin-top: 18px; font-size: 0.88rem; letter-spacing: 0.03em; color: var(--fg-faint); }
  .hero .disciplines span { color: var(--ember); }

  section { padding: 0 0 64px; }

  /* ---- photo grid ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  @media (max-width: 720px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 460px) { .grid { grid-template-columns: 1fr; } }

  .grid figure {
    aspect-ratio: 4/5;
    overflow: hidden;
    background: #100f0a;
  }
  .grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .3s ease;
  }
  .grid a:hover img { transform: scale(1.03); }

  footer {
    padding: 28px 0 40px;
    color: var(--fg-faint);
    font-size: 0.82rem;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
</style>
</head>
<body>

<header class="wrap">
  <div class="nav">
    <a href="#top" class="name">Jay Bihn</a>
    <nav class="nav-links">
      <a href="#work">Work</a>
      <a href="mailto:jay@jaybihn.example">Contact</a>
    </nav>
  </div>
</header>

<main id="top">

  <section class="hero wrap">
    <h1>Custom work in steel and glass.</h1>
    <div class="disciplines"><span>Welding</span> &nbsp;·&nbsp; <span>Glass Blowing</span> &nbsp;·&nbsp; <span>Fabrication</span></div>
  </section>

  <section id="work">
    <div class="wrap">
      <!--
        Photo grid — replace each src below with a real photo.
        Keep the alt text descriptive; it's what screen readers announce.
        Add or remove <figure> blocks freely; the grid reflows automatically.
      -->
      <div class="grid">

        <figure>
          <a href="photos/piece-01-full.jpg">
            <img src="photos/piece-01.jpg" alt="Riverside garden gate, welded steel">
          </a>
        </figure>

        <figure>
          <a href="photos/piece-02-full.jpg">
            <img src="photos/piece-02.jpg" alt="Amber blown glass pendant light">
          </a>
        </figure>

        <figure>
          <a href="photos/piece-03-full.jpg">
            <img src="photos/piece-03.jpg" alt="Reclaimed oak and steel console table">
          </a>
        </figure>

        <figure>
          <a href="photos/piece-04-full.jpg">
            <img src="photos/piece-04.jpg" alt="Freestanding steel sculpture">
          </a>
        </figure>

        <figure>
          <a href="photos/piece-05-full.jpg">
            <img src="photos/piece-05.jpg" alt="Blown glass vessel set">
          </a>
        </figure>

        <figure>
          <a href="photos/piece-06-full.jpg">
            <img src="photos/piece-06.jpg" alt="Steel-framed glass room divider">
          </a>
        </figure>

      </div>
    </div>
  </section>

</main>

<footer class="wrap">
  <span>Jay Bihn</span>
  <span>jay@jaybihn.example</span>
</footer>

</body>
</html>
